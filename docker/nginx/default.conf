server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Fichiers buildés par Vite avec un hash dans le nom -> cache long et immuable.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html doit toujours être revalidé pour pointer vers les derniers assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router en mode history : toute route inconnue retombe sur l'index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
